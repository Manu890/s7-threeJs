<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signal Settings · PLC Signal Analyzer</title>
<style>
:root{color-scheme:dark;--bg:#0b111a;--panel:#121c29;--panel2:#182536;--border:#2b3a4e;--text:#e6edf6;--muted:#91a1b5;--accent:#62b6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}
main{max-width:620px;margin:24px auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px}
h1{font-size:22px;margin:0 0 6px}p{color:var(--muted);line-height:1.5}.field{margin:22px 0}.field label{display:block;font-weight:600;margin-bottom:8px}.field select{width:100%;padding:11px;border:1px solid var(--border);border-radius:7px;background:var(--panel2);color:var(--text);font-size:14px}.hint{font-size:12px;margin-top:7px}.actions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}button,a{padding:10px 15px;border-radius:7px;border:1px solid var(--border);font:inherit;text-decoration:none;cursor:pointer}button.primary{background:var(--accent);color:#081421;border-color:var(--accent);font-weight:700}a{color:var(--text);background:var(--panel2)}#status{min-height:20px;color:#8bd3a8;margin-top:14px}
</style>
</head>
<body>
<main>
<h1>Signal settings</h1>
<p id="signalName">Choose the data type and display precision for this trace.</p>
<div class="field"><label for="type">PLC data type</label><select id="type"></select><div class="hint">Changing this updates how the PLC address is decoded.</div></div>
<div class="field"><label for="precision">Display precision</label><select id="precision"></select><div class="hint">Digits after the decimal point for REAL values. This changes display formatting only, not the recorded raw sample.</div></div>
<div class="actions"><button class="primary" id="save">Save settings</button><a href="signal-analyzer.html">Cancel</a></div>
<div id="status" role="status"></div>
</main>
<script>
(function(){
 const STORAGE_KEY="s7-threejs-signal-analyzer-signals-v1";
 const params=new URLSearchParams(location.search);
 const key=params.get("key");
 const typeOptions=[["X","BOOL / bit"],["B","BYTE"],["C","CHAR"],["S","STRING"],["I","INT"],["DI","DINT"],["W","WORD"],["D","DWORD (legacy)"],["DW","DWORD"],["R","REAL / float"],["RI","RINT"],["RDI","RDINT"],["RW","RWORD"],["RD","RDWORD (legacy)"],["RDW","RDWORD"],["RR","RREAL"],["TMR","TIMER"],["CTR","COUNTER"],["LR","LREAL"],["DT","DATE_TIME"],["DTZ","DATE_TIME UTC"],["DTL","DATE_AND_TIME_LONG"],["DTLZ","DATE_AND_TIME_LONG UTC"]];
 const type=document.getElementById("type"),precision=document.getElementById("precision"),status=document.getElementById("status");
 typeOptions.forEach(function(item){const o=document.createElement("option");o.value=item[0];o.textContent=item[1];type.appendChild(o);});
 for(let digits=0;digits<=20;digits++){const o=document.createElement("option");o.value=String(digits);o.textContent=digits+" decimal place"+(digits===1?"":"s");precision.appendChild(o);}
 let savedSignals;
 try{savedSignals=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");}catch(e){savedSignals=[];}
 if(!Array.isArray(savedSignals))savedSignals=[];
 const signal=savedSignals.find(function(s){return s&&s.key===key;});
 if(!signal){document.getElementById("signalName").textContent="Signal not found in this browser's saved configuration.";document.getElementById("save").disabled=true;status.textContent="Return to the analyzer and reopen settings for a signal.";return;}
 document.getElementById("signalName").textContent=signal.label+" · "+(signal.address||("key: "+signal.key));
 type.value=signal.type||"B";precision.value=String(Math.min(20,Math.max(0,signal.precision===undefined?2:Number(signal.precision)||0)));
 document.getElementById("save").addEventListener("click",function(){
  signal.type=type.value;signal.dataType=type.value;signal.precision=Number(precision.value);
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(savedSignals));}catch(e){status.textContent="Could not save settings in this browser.";return;}
  status.textContent="Settings saved.";
  if(window.opener&&!window.opener.closed){
   try{window.opener.postMessage({type:"signalSettingsUpdated",key:signal.key,plcType:signal.type,precision:signal.precision},location.origin);window.close();}catch(e){status.textContent="Settings saved. Close this window and return to the analyzer.";}
  }else{
   const back=document.createElement("a");back.href="signal-analyzer.html";back.textContent=" Return to analyzer";back.style.marginLeft="10px";document.querySelector(".actions").appendChild(back);
  }
 });
})();
</script>
</body>
</html>
